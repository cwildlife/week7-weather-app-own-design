<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="src/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Henny+Penny&display=swap"
        rel="stylesheet">

    <title>Let's get Coding</title>
</head>

<body>
    <div id="app-container">

        <header>
            <form id="search-form">

                <input type="search" id="city-input" placeholder="Enter a city name..." required />
                <input type="submit" id="city-search-button" value="Search" />
            </form>

            <div>
                <span id="date-time">Friday 12:00</span>
            </div>

        </header>

        <main>

            <h1 class="city-name" id="city-name"> Dronten </h1>
            <div class="emoji-temp-unit-container">
                <span class="emoji" id="emoji" class="emoji">
                    <img src="http://shecodes-assets.s3.amazonaws.com/api/weather/icons/broken-clouds-day.png" />
                </span>
                <span class="temperature-value" id="temperature-value">16</span>
                <span class="unit" id="unit">℃</span>
            </div>



            <div id="conditions-container">
                <span id="conditions-description">few clouds</span>
                <span class="humidity-wind-data">
                    <br />
                    Humidity: <strong id="humidity">15%</strong>
                    <br />
                    Wind: <strong id="wind-speed">41km/h</strong>
                </span>
            </div>

        </main>

        <footer>
            <p>
                This project was coded by
                <a href="https://github.com/cwildlife" target="_blank">Celeste Rust</a> and is
                <a href="https://github.com/cwildlife/week7-weather-app-own-design" target="_blank"> on GitHub</a> and
                <a href="https://week7-weather-app-own-design.vercel.app/" target="_blank">hosted on Vercel</a>
            </p>
        </footer>

        <script src="src/script.js"></script>
    </div>
    </div>
</body>

</html>
