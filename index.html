<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="src/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Henny+Penny&display=swap"
        rel="stylesheet">

    <title>Let's get Coding</title>
</head>

<body>
    <div id="app-container">

        <header>

            <!-- <button> Change Theme </button> to be added in final project-->

            <form id="search-form">

                <input type="search" id="city-input" placeholder="Enter a city name..." required />
                <input type="submit" id="city-search-button" value="Search" />
            </form>

            <div>
                <span id="date-time"></span>
            </div>

        </header>

        <main>
            <div id="city-temp-container">
                <div>
                    <h1 id="city-name"> Dronten </h1>
                </div>

                <div id="temperature">
                    <p>
                        <span id="emoji" class="emoji">☀️</span>
                        <span id="temperature-value">21</span>
                        <span id="unit">°C</span>
                    </p>
                </div>
            </div>
            <div id="conditions">
                <p>
                    <span id="conditions-description"></span>

                    <br />
                    Humidity: <strong id="humidity">15%</strong>
                    <br />
                    Wind: <strong id="wind-speed">41km/h</strong>
                </p>
            </div>
        </main>

        <footer>
            <p>
                This project was coded by
                <a href="https://github.com/cwildlife" target="_blank">Celeste Rust</a> and is
                <a href="https://github.com/cwildlife/week7-weather-app-own-design" target="_blank"> on GitHub</a> and
                <a href="https://week7-weather-app-own-design.vercel.app/" target="_blank">hosted on Vercel</a>
            </p>
        </footer>

        <script src="src/script.js"></script>
    </div>
</body>

</html>
