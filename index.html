<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="src/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>

    <title>Let's get Coding</title>
</head>

<body>
    <header>

        <button> Change Theme </button>

        <form id="search-form">

            <input type="search" id="city-input" placeholder="Enter a city name..." required />
            <input type="submit" id="city-search-button" value="Search" />
        </form>

    </header>

    <main>
        <div>
            <h1> Dronten </h1>
        </div>

        <div id="date">
            <p>
                <span id="day">Monday</span>
                <span id="time">10:00</span>
            </p>
        </div>

        <div id="temperature">
            <p>
                <span id="emoji">☀️</span>
                <span id="temperature-value">20</span>
                <span id="unit">°C</span>
            </p>
        </div>

        <div id="conditions">
            <p> Scattered clouds
                <br />
                Humidity: 60%
                <br />
                Wind: 5 km/h
            </p>
        </div>
    </main>

    <footer>
        <p>
            This project was coded by
            <a href="https://github.com/cwildlife" target="_blank">Celeste Rust</a> and is
            <a href="https://github.com/cwildlife/week7-weather-app-own-design" target="_blank"> on GitHub</a> and
            <a href="https://week7-weather-app-own-design.vercel.app/" target="_blank">hosted on Vercel</a>
        </p>
    </footer>

    <script src="src/script.js"></script>
</body>

</html>
